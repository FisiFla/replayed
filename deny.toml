[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # Marvin timing attack in `rsa`: only used (dev-dependency) to mint a throwaway RSA test leaf
  # for the LoL mock TLS server; no network-facing RSA operation in shipped code, no fix available.
  "RUSTSEC-2023-0071",
  # ZIP extraction advisories in `zip 4.6.1`, reached only through `tauri-plugin-updater`.
  #
  # `zip` arrives with the updater plugin, which unpacks the downloaded installer with
  # `ZipArchive::extract` — exactly the API these three advisories describe. What the
  # advisories need is an attacker-controlled archive, and the plugin never extracts one:
  #
  #   * `Update::install` calls `self.verify(bytes)?` — the minisign check against the
  #     pinned public key, with `require_signed_version` on — and only then calls
  #     `install_inner`, which is what reaches the extraction.
  #   * `Update::download_and_install` is `download` (which verifies) followed by
  #     `install_inner`, and the plugin's own comment says so: "`download` already verified
  #     the bytes".
  #
  # So the bytes that reach `ZipArchive::extract` have been verified against a key whose
  # private half lives in the release pipeline's secrets and never ships. Producing bytes
  # that pass that check means holding the private key.
  #
  # The residual is the shape of the bug rather than its reach: the symlink escape and the
  # Unix permission bits would matter if the signature check were bypassed, or if the
  # application ran privileged. It does not — it is a per-user installer on Windows, where
  # SUID and SGID do not exist and the extracted archive is unpacked into a temporary
  # directory the user owns.
  #
  # There is no fix to take. The 4.x line ends at 4.6.1, the plugin's requirement pins the
  # 4.x line, and OSV reports all three as `NO-FIX`. Bumping is not possible; not shipping
  # the updater would remove the only network path the project has, which is the opposite of
  # what this decision is for.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD",
  "BSL-1.0", "OpenSSL", "CDLA-Permissive-2.0",
]

[bans]
# Duplicates are warned about, not denied: `hashbrown` arrives twice through rusqlite's
# vendored SQLite, and pinning one version of it is a rusqlite decision, not ours.
multiple-versions = "warn"
# A wildcard requirement is a version nobody reviewed. It stays allowed because
# cargo-deny cannot tell a wildcard from a workspace inheritance (`replayed-media.workspace
# = true` is not a wildcard, but it reads as one), and denying it would fail the audit on
# the project's own manifests.
wildcards = "allow"
# The zero-egress claim is only as good as the graph behind it: the League module is the one
# place allowed to build an HTTP client, and nothing else is. Denying the clients themselves
# means a future dependency cannot quietly add one, which the source-tree guard
# (`crates/events/tests/no_egress.rs`) cannot see — it reads our code, not the graph.
#
# `reqwest` and `hyper` are deliberately *not* on this list: `tauri` itself depends on
# `reqwest`, so denying them would fail the desktop shell's own audit for a crate the
# project does not choose — and the updater plugin depends on it too, because it is the one
# thing in this tree that talks to the internet, and only when the user asks it to. The
# guard for the app's own egress stays where it can see it — in the source tree, where the
# dependency check reads the resolved graphs and allows exactly one of them to hold a
# client.
deny = [
  "attohttpc", "isahc", "surf", "ureq",
  # Input synthesis and global input capture (docs/anti-cheat.md). The project captures with
  # Windows Graphics Capture and WASAPI and never synthesises, hooks or polls input: on a machine
  # running kernel-level anti-cheat that is hostile behaviour, and a crate that does it would
  # call `SendInput`, `SetWindowsHookEx` or `GetAsyncKeyState` without our source ever spelling
  # the name — which the source guard (`scripts/check-forbidden-apis.sh`) cannot see. Denying
  # the crates that exist to do it means a new dependency cannot bring that behaviour in
  # quietly; the built executable's import table (`scripts/check-pe-imports.py`) is the check
  # for the ones that do it without being on this list.
  "enigo", "rdev", "autopilot", "inputbot", "device_query", "rustautogui", "winput",
  "willhook", "mki", "mouse-rs", "multiinput",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
