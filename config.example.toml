# ============================================================
# replayed — example configuration
# ============================================================
# Copy to the application data directory and edit:
#   %LOCALAPPDATA%\replayed\config.toml
#
# replayed never reads configuration from environment variables.
#
# Two programs read this one file: the desktop app and `replayed-cli`. They do not read all of
# it. Keys only one of them reads are marked "CLI only" or "desktop only" where they appear. The
# CLI refuses to start without `[buffer]`, `[encode]`, `[audio]`, `[storage]`, `[hotkeys]` and
# `[events]`; the desktop app falls back to the values shown here for what it finds missing.
#
# A value the engine cannot honour is refused with the key named, not clamped or guessed at: a
# zero for `segment_time`, `post_seconds`, `fps` or a retention limit, a `ram_cap_bytes` below
# 8 MiB, `vendor = "software"`, and an `[events] gsi_port` below 1024 (other than 0).

# The version of this file's layout. Written by the app; leave it alone. A file without it
# is read as version 1. A file declaring a version newer than the app understands is refused
# rather than half-read — update replayed instead.
schema_version = 1

[recorder]
# What a recording is:
#
#   "buffer"  — the rolling replay buffer. A bounded in-memory ring holds the last
#               seconds of play, and the hotkey (or a game event) splices a clip out
#               of it. Default, and what every build before Phase 5 did.
#
#   "session" — record the whole session. Segments are written into their own
#               directory under `sessions/` as you play, and no cap applies to them
#               (a full session is not a ring: evicting its
#               oldest segment would delete footage you asked for), and when the
#               recording stops they are concatenated losslessly into one
#               `session-<timestamp>.mp4` — never re-encoded — after which the
#               temporary segments are removed.
#
# Either way a `sessions` row is opened when recording starts and closed when it
# stops, and the hotkey still takes an instant clip from the same footage.
#
# CLI only. The CLI can override this per run with `--mode session` (or `--mode buffer`). The
# desktop app ignores this key and records the replay buffer; of the `[recorder]` section it reads
# only `save_session` below.
mode = "buffer"
# In "buffer" mode, also write the whole recording to a session file while the replay
# buffer keeps serving clips, from the same single encode (no extra GPU or CPU). The file
# is written as you play, so a crash loses about a second; when recording stops it becomes
# an ordinary `session-<timestamp>.mp4` under `sessions/`. A disk that cannot keep up ends
# the session file early with a warning and never the replay buffer. Ignored in "session" mode.
save_session = false

[buffer]
# How much footage before the trigger instant is written into the clip.
pre_seconds = 30
# How much footage after the trigger instant is written into the clip.
post_seconds = 5
# The longest pre-/post-roll ONE clip may ask for (a long-clip hotkey, a per-game length in
# [events.lol] / [events.gsi]). 0 = no more than pre_seconds / post_seconds. These size the
# ring; a request above them is clamped, never an error.
max_pre_seconds = 0
max_post_seconds = 0
# Seconds per segment. This also sets the keyframe interval, and
# therefore the granularity of lossless trimming (cuts snap to <= this value).
# Lower = more precise cuts, higher = larger files. At least 1 (0 is refused). The window
# lengths above and this one are capped at 86400 (a day).
segment_time = 1
# Empty = %LOCALAPPDATA%\replayed\scratch
#
# The shared scratch folder. In "buffer" mode the replay buffer is held in RAM
# (`ram_cap_bytes`) and writes no segment files, so nothing is written here for it. A full
# session (and `save_session`) writes its segments into a folder of its own,
# `session-<timestamp>`, under `[storage.sessions] sessions_dir`, never into this one.
# Retention never deletes this folder or what is in it, so it is safe to point somewhere that
# holds other files, but it is also not cleaned up for you.
scratch_dir = ""
# How much memory a replay buffer may use for the footage it has not been asked to keep,
# in bytes. Default: 256 MiB.
#
# Which footage is held is set by `pre_seconds`: this is the ceiling that keeps the
# application from being killed by the operating system when the encoder is producing
# more than that budget can hold. The oldest footage is dropped first, so a buffer that
# hits this ceiling keeps serving clips - just shorter ones, and it says so in the log
# rather than quietly returning less than was asked for.
# Below 8 MiB is refused; above 64 GiB is clamped to 64 GiB.
ram_cap_bytes = 268435456

[capture]
# What is recorded. Windows only: other platforms have no screen backend and ignore these.
# Monitor index; 0 is the primary monitor. An index with no monitor refuses to start.
monitor = 0
# A window title to record instead of a whole monitor (case-insensitive; an exact title
# beats a substring match, the topmost window wins a tie). Empty records the monitor.
# No visible window matching the title refuses to start rather than recording something else.
window = ""
# What the game-audio track records. "app": only the running game from [games] watch (and its
# child processes), so voice chat and music stay out of the clip; while none runs, and on
# Windows builds before 20348, everything the speakers play. "system": always everything.
game_audio = "app"
# The output device whose audio is recorded when everything the speakers play is captured
# ("system", or "app" while no game runs). Empty is the Windows default output; otherwise an
# endpoint id, which Settings > Audio fills in. A game's own audio follows the game whatever
# device it plays on. A device that is unplugged at start refuses to start.
output_device = ""

[encode]
# auto | nvenc | qsv | amf
# "auto" probes the GPU and picks the first available hardware encoder.
# If none is available replayed exits with an error rather than falling back
# to CPU encoding.
vendor = "auto"
# h264 | hevc
codec = "h264"
# Also settable as a quality preset in the app: low 8000, balanced 20000, high 40000.
# Held as a constant bitrate (CBR) where the encoder obeys it; see docs/verification-status.md section 19.
# The settings panel refuses a value above 250000 (250 Mbit/s); the file itself is not bounded.
bitrate_kbps = 20000
# The frame rate asked for — a ceiling, not a promise. See adapt_fps below. At least 1 (0 is
# refused); the settings panel offers 1 to 240.
fps = 60
# Measure what this machine can actually sustain at the capture resolution and
# record at the lower of that and `fps` (default: true).
#
# This is a *pacing* choice, not the timeline's guarantee. Every captured frame
# costs work before it reaches the encoder — on Windows a GPU-to-CPU readback of
# the whole frame, 33 MB at 4K — and the encoder throws away whatever it cannot
# keep. Measured on 4K hardware with fps = 30: ~24 fps sustained and ~45% of
# delivered frames dropped, which is wasted work and a picture that holds
# through the dropped moments.
#
# The recorded timeline does NOT depend on this setting. Frames carry their
# arrival timestamps and the encoder no longer resamples them onto a declared
# grid, so a `pre_seconds = 10` clip is 10 real seconds of footage on a machine
# of any speed — the frames a slow machine cannot encode are simply held on
# screen. What this setting buys you is the capture work not spent on frames the
# encoder will drop, and a warning at startup instead of a surprise in the clip.
#
# With this on, replayed spends ~1.5 s at startup encoding frames at the real
# capture resolution with the selected encoder, and both the pacer and the
# encoder child are then told the rate it measured. Startup logs what it
# measured and, if that is below `fps`, warns you which rate is in use and why.
#
# false = skip the measurement and declare `fps` exactly as configured. Useful
# if the ~1.5 s of startup matters to you, or if you want to force a rate above
# what the probe measures. The frames the machine cannot encode are then dropped
# (held in the picture) and counted in the status line's `dropped=`.
adapt_fps = true
# Empty = capture at native resolution. Otherwise "WIDTHxHEIGHT", e.g. "1920x1080".
# This is also the single biggest lever on the sustainable rate: at 4K a frame is
# 33 MB, at 1080p it is 8 MB.
output_size = ""
# How the encoder spends its bitrate: "cbr" (hold the rate), "vbr" (aim near it; the peak may
# rise to 150% of it) or "quality" (the encoder's own constant quality, so file size follows
# the picture and `bitrate_kbps` is not a target). Default "cbr". The zero-copy path (below)
# offers "cbr" and "vbr" only.
#
# rate_control = "cbr"
#
# The encoder's own preset, passed to ffmpeg's `-preset`. Empty = the encoder's default.
# NVENC takes p1..p7, QSV veryfast..veryslow, AMF speed/balanced/quality. A preset that does
# not belong to the encoder that was picked is dropped with a warning, not passed on. The
# zero-copy path has no preset and ignores this.
#
# preset = ""

# Hand captured frames to the hardware encoder as GPU textures, so their pixels never
# reach this process's memory. Default: false.
#
# What it removes, measured on this project's 4K machine: the capture path copies 33.2 MB out
# of VRAM for every frame, which is about 97% of what the pipeline does while recording
# (`capture=` on the debug line). With this on, a hardware encoder MFT takes the captured
# texture directly and ffmpeg is told to copy the H.264 that comes out - a few hundred
# kilobytes a second across the pipe instead of gigabytes.
#
# Two things it needs, both refused at startup rather than ignored: a hardware `vendor`
# (a software encoder has no MFT to hand a texture to), and Windows (the handover is
# Media Foundation's). It also requires `output_size` to be the capture size: ffmpeg is
# copying the video rather than encoding it, so it cannot scale it, and scaling would mean
# decoding, which would mean the pixels this mode exists to keep out of memory.
#
# **Leaving this unset is the default, and it means "use it when the hardware can"**: a
# detected hardware `vendor` on Windows gets the hardware path, and anything else gets the
# ordinary one with a line in the log saying so. That is deliberate — a default that
# refused to start would be a recorder that does not record on whichever machine it was
# copied to.
#
# Setting it changes that. `true` *requires* the hardware path and refuses to start
# without it; `false` turns it off everywhere.
#
# The hardware path only uses an encoder on the GPU the captured display is on: a texture
# cannot be handed to another GPU's encoder, and frames are never copied between GPUs. On a
# machine with two (an NVIDIA card and an Intel iGPU, say), `vendor = "qsv"` while the game's
# display is on the NVIDIA card records through ffmpeg's `h264_qsv` on the ordinary path
# when this is unset, and refuses to start, naming the GPU, when it is `true`.
#
# Measured on the 4K Windows test machine it was built for: 4.0% of one core against 88.9% on the readback
# path, 59.6 fps of 60 against 55.5, and no dropped frames against 8. See
# docs/verification-status.md (§15).
#
# zero_copy = true

[audio]
# CLI only: the desktop app does not read this key and always records the game audio (it reads
# `bitrate_kbps` below, nothing else here).
#
# Whether the game-audio track is recorded. `false` is a **video-only recording**: the encoder
# is given no audio input at all, no loopback listener is bound and the container carries no
# audio stream. Smaller files and one fewer capture session, for footage whose sound is
# accounted for elsewhere.
#
# It cannot be combined with `[mic] enabled = true` below: a container's audio tracks are named
# by position (the first is "Game Audio"), so a one-track file holding only a voice would be
# labelled as the game's own audio. That combination is refused at start, naming both keys,
# rather than recorded under a name the file does not earn.
enabled = true
# Only "loopback" is implemented. Anything else is refused at startup (`Config::validate`),
# naming the implemented value, rather than recorded as loopback while the file says
# otherwise: the pipeline captures the system loopback, and the only other audio input is the
# microphone (`[mic]`, a second track rather than a different source for this one).
source = "loopback"
# Only "aac" is implemented, for the same reason. The audio codec is fixed in ffmpeg's
# argument list; a second value here would be a second source of truth.
codec = "aac"
# The game-audio track's bitrate, in kbps. **This key is honoured**: it reaches ffmpeg's
# `-b:a`, so the file records what this says — and it is unused when `enabled = false`, which
# encodes no audio at all. 192 is what every build without a readable key has recorded.
# The settings panel refuses a value above 512.
bitrate_kbps = 192

[storage]
# Empty = %LOCALAPPDATA%\replayed\clips
#
# Changing this while a recording is running takes effect for the recorder only after it
# restarts; the settings panel says so. The window may only read a clips folder you picked
# in its folder picker (or that this file already named at start-up), and once the window has
# stopped reading a folder it cannot be pointed back at it until replayed restarts.
clips_dir = ""
# Default: 50 GiB. Favourited clips count toward the total but are never deleted to meet it.
# Must be greater than 0: a zero cap is exceeded by every file, so it is refused (the
# recording will not start) rather than deleting every clip that is not a favourite.
max_total_bytes = 53687091200
# Clips older than this many days are deleted; favourited clips are exempt. Must be at least
# 1: 0 is refused for the same reason as above.
max_age_days = 7

# --- The session store (Phase 5) -----------------------------------------------
# Full-session recordings, and the session rows of buffer runs, are managed by the
# *same* two rules with their own numbers: clips and sessions are evicted
# independently, so a large session library can never push your clips out (or the
# other way round). Favourited sessions are exempt from both rules, exactly as
# favourited clips are — and so is a session that is still recording: its scratch
# directory is footage that exists nowhere else yet, so the cap counts its bytes but
# never evicts it. A live recording that alone exceeds the cap is reported as an
# unsatisfiable cap rather than paid for out of the finished sessions beside it.
#
# Defaults: 200 GiB and 7 days. A 4K session is roughly 9 GB an hour at the example
# bitrate, so raise the cap if you record long sessions at 4K. As above, 0 is refused for
# both numbers.
#
# Automatic cleanup only ever deletes inside `clips_dir` and `sessions_dir` (a clip's file
# inside the first, a session's file and its `session-<n>` folder inside the second); an empty
# `sessions_dir` means `<app data>/sessions`. If you
# move either folder, the index rows written under the old one are no longer cleaned up
# automatically. A `%` in either path is fine.
[storage.sessions]
# Empty = %LOCALAPPDATA%\replayed\sessions
sessions_dir = ""
max_total_bytes = 214748364800
max_age_days = 7

# --- The microphone (Phase 5) ---------------------------------------------------
# Record a voice track alongside the game audio. **Off by default**, and deliberately
# so: a microphone is not the game's own audio, the machine may have no capture
# endpoint at all, and a recording that silently gained a track nobody asked for is a
# surprise. With this off, the encoder is invoked exactly as it was before the feature
# existed (one audio input, no second track).
#
# With it on, every session file carries TWO audio tracks — the game audio first, the
# microphone second — and every clip THREE: a "Game + Mic" mix first, for the players that
# play only a file's first audio track, then those two as recorded. The microphone is the default
# *communications* capture endpoint (the device Windows assigns to voice chat) unless
# `device` below names another. On Windows this needs a capture device; if it cannot be
# started, the recording fails at start rather than producing a video with a silent
# voice track. Once a recording is running, losing the microphone (a headset unplugged) does
# not end it: the gap is filled with silence, so the voice stays in step with the video, and
# the microphone is reopened when the device comes back.
#
# Turning this on with `[audio] enabled = false` is refused at start, naming both keys:
# the container's first audio track is named "Game Audio", so a video-only recording
# with a voice in it would carry that voice under the name of a track it does not have.
[mic]
enabled = false
# The microphone to record: an endpoint id, which Settings > Audio fills in. Empty is the
# Windows default communications microphone. A device that is unplugged at start refuses to
# start rather than recording another one.
device = ""

# --- Game presence, and recording that follows it (Phase 5) ---------------------
# When `auto_record = true`, replayed watches for the titles below and records one
# session per game: recording starts when the game starts and stops (and is
# finalised, and the storage policy is applied) when it stops.
#
# **Off by default, and that is the whole safety posture of the feature**: with it
# off, no watcher thread exists at all — nothing is polled and no game is looked
# for. (The game-audio path still enumerates the process list, once, to find the
# watched game's process id for the per-application capture; that is a different
# feature and it does not run a watcher.) League of Legends is detected through Riot's own
# Live Client Data API (a read-only GET of /liveclientdata/gamestats on 127.0.0.1:2999, which
# only answers during a real match, and whose answer has to describe a game); every other title
# by comparing process names in a snapshot — the same enumeration Task Manager does, with
# nothing opened, read or injected, and no handle held between polls. A process-name match
# means the game's executable is running, which is taken as the game being open: it cannot tell
# a match from the main menu. Nothing is ever sent anywhere but loopback.
#
# `poll_ms` is how often to look; it is clamped to 250..30000. A change is believed
# after two consecutive polls, so one flickering snapshot cannot start or end a
# session.
#
# The titles watched when no `[[games.watch]]` list is given: League of Legends
# (Live Client Data API), Counter-Strike 2 (`cs2.exe`), Dota 2 (`dota2.exe`),
# Rainbow Six Siege (`RainbowSix.exe`), Valorant (`VALORANT-Win64-Shipping.exe`) and
# Overwatch 2 (`Overwatch.exe`) — always the *game* process, never the launcher's.
#
# Name your own list like this (it replaces the default one):
#   [[games.watch]]
#   name = "Dota 2"
#   exe = "dota2.exe"
#   signal = "process"            # or "live_client_api"
[games]
auto_record = false
poll_ms = 2500

[hotkeys]
# A chord is any of the modifiers Ctrl, Alt and Shift plus one key, joined by "+": F1..F24,
# one letter or one digit. A letter or a digit must carry Ctrl or Alt: the chord is claimed
# system-wide, so a bare "K" would stop you typing K anywhere, and Shift+K still types a
# capital K. A function key may stand alone or with Shift. Holding the chord counts as one
# press, and presses closer together than 300 ms count as one.
clip = "Ctrl+F8"
# Desktop app only, off unless uncommented. Each must be a chord nothing else holds:
#   toggle_recording = "Ctrl+F9"   # start / stop the recording
#   bookmark = "Ctrl+F10"          # a marker on the session timeline, no clip
#   screenshot = "Ctrl+F7"         # one frame of the display → a PNG in the library
# Only these three are read in this build. Anything else here is ignored, because the
# config structs do not deny unknown fields. The CLI accepts these keys too, so one file
# serves both, but only the desktop app acts on them.

[app]
# Start replayed with Windows (the desktop app; the CLI is never autostarted).
#
# `true`  = the app owns a value under
#           HKCU\Software\Microsoft\Windows\CurrentVersion\Run — the per-user Run key — so
#           the tray icon and the clip hotkey are there again after a reboot.
# `false` = that value is removed, if this app put it there. Nothing else in the Run key is
#           ever touched: the value name is replayed's own.
#
# The file is the only switch **for this key**: Settings > Startup writes it, and applying
# the checkbox also asks Windows for the entry at once, but the next launch re-syncs the
# entry from the file either way, so an entry that disagreed with the file would not survive.
# The entry's command line carries `--background`, so a launch by the login hides the window
# and leaves the tray icon and the hotkey; launching the app by hand shows the window.
# Windows only — off Windows the setting is saved and nothing is registered.
start_with_system = false

[events]
# --- League of Legends (Riot's Live Client Data API) -------------------------------
# Poll https://127.0.0.1:2999/liveclientdata/allgamedata while a game is running and turn
# kills, deaths, assists, objectives and the game's start/end into clips (see the
# highlights/markers note below).
#
# The poller only ever talks to 127.0.0.1:2999 — the game's own local API. A refused
# connection is its normal state (no game running, or no League installed) and is not an
# error. The endpoint's certificate is issued by a root the client pins (the platform roots
# are disabled), so nothing is relaxed but the host-name match — an IP literal has no name
# to satisfy. The relaxation lives in exactly one file, the one that also pins the address,
# and a guard test asserts that no file in the tree disables chain verification and that
# exactly one may relax the host-name check.
lol_poll_enabled = true

# --- CS2 / Dota 2 (Valve Game State Integration) ------------------------------------
# The port the GSI listener binds on 127.0.0.1. Set it to 0 to leave the listener off; it
# never binds anything but loopback. Omitting the key does NOT turn it off: an omitted
# gsi_port is 45671, so the listener is on. A non-zero value must be 1024 to 65535.
#
# The listener requires a token, which arrives inside the game's POST body (in the payload's
# "auth" object — that is how Valve's "auth" block works; GSI sends no Authorization
# header). replayed generates one per game on first use into
# <app data dir>/gsi-token-cs2.txt and <app data dir>/gsi-token-dota2.txt, and writes
# the file you have to install to:
#   <app data dir>/gsi/cs2/gamestate_integration_replayed.cfg
#   <app data dir>/gsi/dota2/gamestate_integration_replayed.cfg
# Copy the one for the game you play into its cfg directory:
#   .../Counter-Strike Global Offensive/game/csgo/cfg/
#   .../dota 2 beta/game/dota/cfg/gamestate_integration/
# and restart the game. A payload whose token does not match is answered HTTP 403 and
# ignored; the token itself is never logged. Delete the gsi-token-<game>.txt file to rotate
# that game's token (the generated cfg file must then be replaced too). The desktop app
# does the copy for you when it finds a gamestate_integration_replayed.cfg already in a Steam
# library's game folder as a recording starts (and rewrites an out-of-date one); with the CLI,
# or a game outside a Steam library it found, copy the file yourself. A token from before
# per-game tokens (gsi-token.txt) is not reused: install the cfg again.
#
# Requests that carry a browser's Sec-Fetch-* headers are refused with 403: the game never
# sends them, a web page always does.
#
# Each game has its own token and its own path, and the listener refuses a payload whose
# provider app id is not that game's, so a token lifted from one game's installed cfg
# cannot forge the other game's events.
#
# A FIXED port can be squatted on by another local program before this one starts, and a
# program squatting on it receives the game's POSTs -- and with them the token. Set
# gsi_ephemeral_port to true to have the operating system pick an unguessable port
# instead; the generated cfg always names the port the listener actually bound, so the
# game still finds it. 0 switches the listener off entirely.
gsi_port = 45671
gsi_ephemeral_port = false

# Highlights that should be recorded on the session timeline but NOT take a clip. Tags are
# kill, death, assist, objective, dragon, baron, herald, turret, inhibitor, bomb_planted,
# bomb_defused, game_end. "objective" mutes every objective kind (dragon, baron, ... too);
# a single kind mutes only itself. A typo is an error, not a silent no-op.
# Example: only clip kills, dragons and barons.
#   mute_clips = ["death", "assist", "objective"]  # then list nothing else to keep
#   mute_clips = ["turret", "inhibitor"]           # just the structures
mute_clips = []

# Per-game clip length for event clips; an unset key uses [buffer]. Clamped to
# [buffer] max_pre_seconds / max_post_seconds. [events.gsi] covers CS2 and Dota 2.
#   [events.lol]
#   pre_seconds = 25
#   post_seconds = 8

# --- What an event does -------------------------------------------------------------
# A *highlight* (kill, death, assist, objective, bomb planted/defused, end of game) takes a
# clip through the same trigger the hotkey uses: pre_seconds before it, post_seconds after
# it, losslessly spliced. A *marker* (a game or round starting or ending) is recorded in the
# events table so the session timeline shows it, and takes no footage — a Counter-Strike
# match would otherwise write a clip per round. Why a clip was taken is written to the same
# table, linked to the clip.
