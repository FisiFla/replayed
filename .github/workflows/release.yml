# Release pipeline for replayed.
#
# ---------------------------------------------------------------------------
# WHAT IT DOES
# ---------------------------------------------------------------------------
# A version tag becomes a published GitHub Release carrying the Windows NSIS installer, in four
# jobs that each hold only the authority they need:
#
#   gate     (ubuntu)  decides whether this tag may be released at all. No secret, read-only.
#   build    (windows) builds the installer from the tagged commit, UNSIGNED. No secret at all:
#                      this is the job that runs every build script and every dependency, so it
#                      is the one that must not hold the updater's signing key or a write token.
#   sign     (ubuntu)  signs the installer with the updater key and proves the signature
#                      verifies against the key pinned in the app. The only job with the key,
#                      and it runs nothing but the Tauri CLI's signer.
#   publish  (ubuntu)  creates a DRAFT release, checks what GitHub stored, then publishes it.
#                      The only job with a write token, and it has no signing key.
#
# Triggers:
#
#   - a `push` of a version tag starts the pipeline and publishes that tag. The tag pattern is
#     anchored: `v1.2.3` and `v1.2.3-rc.1`, never `vfoo` or `v1.2.3.4`. A tag with a `-` is a
#     PRE-RELEASE and is published with `--prerelease`, so it can never become the "latest"
#     release and so can never be what `releases/latest/download/latest.json` serves to every
#     installed copy of the application;
#   - `workflow_dispatch` starts it by hand, which is how a release is re-cut: give the tag in
#     the `tag` input, or dispatch the workflow on the tag itself.
#
# ---------------------------------------------------------------------------
# THE GATE
# ---------------------------------------------------------------------------
# Nothing is published unless, for the exact commit the tag names:
#
#   - the tag is a version tag, the checkout is the tag's commit, and that commit is reachable
#     from the default branch (a tag pushed from an unreviewed branch is not a release);
#   - every place the version is written agrees with the tag, and CHANGELOG.md has its section
#     (`scripts/check-release-version.py`);
#   - the `CI` workflow has a SUCCESSFUL run on that commit: the same tests, clippy, `cargo
#     deny`, anti-cheat guard, `npm audit` and secret scan that gate every merge. This workflow
#     does not re-run them (they take far longer than the release itself); it refuses to
#     release a commit they have not passed. If CI is still running it waits, up to 30 minutes.
#     A `pull_request` run does not count: it tests the merge of the pull request with its
#     base, not the commit that was tagged.
#
# On top of that, the build job fails if the executable inside the installer imports a function
# that injects into another process, hooks, or synthesises input (`scripts/check-pe-imports.py`,
# docs/anti-cheat.md): the source guard reads our code, and only the import table of what ships
# sees a dependency.
#
# ---------------------------------------------------------------------------
# THE ASSETS
# ---------------------------------------------------------------------------
# With `bundle.createUpdaterArtifacts: true` (the Tauri 2 mode) the bundler signs the NSIS
# installer *itself* and writes `<installer>.sig` beside it. There is no `.nsis.zip`; that is
# the Tauri 1 layout, produced only under `"v1Compatible"`. An earlier version of this file
# looked for the zip, found none and could never publish.
#
#   - `replayed_<version>_x64-setup.exe` — the NSIS installer, and also the updater's artifact:
#     the installed application downloads this file and runs it;
#   - `replayed_<version>_x64-setup.exe.sig` — the minisign signature, made with the release
#     key whose public half is pinned in `tauri.conf.json`, bound to this file name and this
#     version (`requireSignedVersion`);
#   - `SHA256SUMS` — the installer's SHA-256 in `sha256sum -c` format;
#   - `latest.json` — the update manifest. It names the installer and carries its signature,
#     and is served under the stable name `releases/latest/download/latest.json`, the one URL
#     the application asks (`plugins.updater.endpoints`).
#
# The unsigned installer is also kept as a workflow artefact, so a release that fails to publish
# still leaves what was built on the Actions page.
#
# ---------------------------------------------------------------------------
# THE SIGNING KEY
# ---------------------------------------------------------------------------
# Two secrets, read by ONE step of ONE job (`sign`), which runs in the `release` environment
# (GitHub creates it on first use; add required reviewers to it to make every release wait for
# a human):
#
#   - `TAURI_SIGNING_PRIVATE_KEY` — the private minisign key, base64, exactly as
#     `tauri signer generate` wrote it. It never enters the repository;
#   - `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` — its password.
#
# `tauri build` and `tauri signer sign` do NOT refuse a key that is not the pinned one: they
# sign anyway and print a warning. A release signed with the wrong key would publish an update
# that no installed copy accepts. So the pipeline checks it itself, twice, before and after the
# draft exists, with `scripts/verify-updater-signature.py`, which repeats what the application's
# updater does and is stricter (it wants the file name and the version in the signed comment).
# The `sign` job does no caching and installs with `--ignore-scripts`, so the only code that
# runs while the key is in the environment is the Tauri CLI that the lockfile pins.
#
# ---------------------------------------------------------------------------
# DRAFT, THEN PUBLISH
# ---------------------------------------------------------------------------
# The release is created as a draft, which no one can download and the updater cannot see. The
# `publish` job then downloads what GitHub actually stored, checks the installer's SHA-256
# against what was built and verifies the signature on the stored bytes, and only then turns the
# draft into a release. A re-cut deletes a stale DRAFT of the tag; a release that is already
# PUBLISHED is never replaced in place (installed copies may already have updated from it):
# delete it by hand, deliberately, to re-cut.
#
# ---------------------------------------------------------------------------
# PERMISSIONS
# ---------------------------------------------------------------------------
# Read-only by default. `gate` adds `actions: read` (to read CI's run), `publish` adds
# `contents: write` (to create the release). Neither the signing key nor a write token is ever
# in the job that builds.
#
# ---------------------------------------------------------------------------
# ACTION PINS
# ---------------------------------------------------------------------------
# Every action is pinned to a full commit SHA, with the human-readable version beside it, for
# the reason `.github/workflows/ci.yml` sets out: a mutable tag can be repointed at new code
# without any change in this file. Refresh one with:
#
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#
# `dtolnay/rust-toolchain` is the awkward one, as in CI: the branch's head pins the action's own
# code, not the compiler. The setup below names `toolchain: 1.99.1` in its `with:` block, so a
# release tag is built by the compiler named here — the same one CI tests against.
#
# The release itself is published with the GitHub CLI, which is preinstalled on the hosted
# runner. That is deliberate: a third-party release action would be one more dependency to hand
# a write token to.
#
# ---------------------------------------------------------------------------
# CARGO IS ALWAYS --locked
# ---------------------------------------------------------------------------
# The two `Cargo.lock` files are what `cargo deny` audited. Without `--locked` cargo silently
# re-resolves a stale one, and the release would be built from a dependency set nobody reviewed.

name: Release

on:
  push:
    tags:
      # Anchored on purpose (`v*` also matched `vfoo`). The gate job applies the full
      # semantic-version pattern; these two only decide whether the workflow starts.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Re-cut a release by hand: either name the tag in the input, or dispatch the workflow
  # on the tag itself. The tag must already exist — this workflow publishes a tag, it does
  # not invent one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0 or v0.2.0-rc.1. Leave empty to use the tag the run was dispatched on.'
        required: false
        type: string

permissions:
  contents: read

# A release is never cancelled half-published: `cancel-in-progress` stays false, and the
# group is keyed on the *tag* so a manual re-cut cannot race the tag's own run.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (tag, version, CI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # The CI workflow's runs are read through the API.
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Resolve the release tag
        id: tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          tag="${tag//[[:space:]]/}"
          if [ -z "$tag" ]; then tag="$REF_NAME"; fi
          # The whole tag, anchored at both ends: semantic versioning, no build metadata. The
          # old check anchored only the start, so `v1.2.3 anything` passed it. The pre-release
          # part is checked here only for its characters; check-release-version.py below applies
          # the exact semantic-version grammar.
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::the release needs a version tag like v0.1.0 or v0.2.0-rc.1, and got '$tag'. This run was dispatched on ref '$REF_NAME' (ref type: $REF_TYPE). Pick the tag in the Ref dropdown, or fill in the 'tag' input."
            exit 1
          fi
          # A hyphen after the core is a pre-release. It is published as one, so it is never
          # "the latest release" and never what the updater's stable URL serves.
          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "releasing tag: $tag (pre-release: $prerelease)"
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          # The whole history and every tag: the tag's commit is checked against the default
          # branch below.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit the tag points at
        id: commit
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The tag must exist, and the checkout must be sitting on the commit it names — a
          # release built from anything else would not be the release of that tag.
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")" || {
            echo "::error::the tag '$TAG' does not exist in the repository"
            exit 1
          }
          head="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head" ]; then
            echo "::error::the tag '$TAG' points at $tag_commit but the checkout is at $head"
            exit 1
          fi
          # A release is cut from the default branch's history. A tag pushed from an unreviewed
          # branch would otherwise be built, signed with the release key and published.
          # (`fetch-depth: 0` above already fetched every branch head.)
          if ! git merge-base --is-ancestor "$head" "origin/$DEFAULT_BRANCH"; then
            echo "::error::the tag '$TAG' ($head) is not on '$DEFAULT_BRANCH'. Merge the commit first, then tag it."
            exit 1
          fi
          echo "tag $TAG -> $head (on $DEFAULT_BRANCH)"
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - name: Check the version in every place it is written
        id: version
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The tag, Cargo.toml (workspace and desktop shell), package.json, package-lock.json,
          # tauri.conf.json and the CHANGELOG section must all name one version. `-I`: Python
          # in isolated mode, so nothing in the working directory can shadow the standard library.
          python3 -I scripts/check-release-version.py --tag "$TAG" | tee version.txt
          echo "version=$(sed -n 's/^version=//p' version.txt)" >> "$GITHUB_OUTPUT"

      - name: Require a passing CI run on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # `push` and `workflow_dispatch` runs test exactly the commit they ran on. A
          # `pull_request` run tests the merge of the pull request into its base and so says
          # nothing about this commit, and is not counted.
          # shellcheck disable=SC2016  # `$ENV` is jq's, not the shell's
          query='[.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch") and .head_sha == $ENV.SHA)]
                 | [ (map(select(.conclusion == "success")) | length),
                     (map(select(.status != "completed")) | length) ] | @tsv'
          deadline=$((SECONDS + 1800))
          while :; do
            read -r passed pending < <(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" --jq "$query")
            if [ "$passed" -gt 0 ]; then
              echo "CI passed on $SHA"
              exit 0
            fi
            if [ "$pending" -gt 0 ] && [ "$SECONDS" -lt "$deadline" ]; then
              echo "CI is still running on $SHA; waiting"
              sleep 30
              continue
            fi
            if [ "$pending" -gt 0 ]; then
              echo "::error::CI is still running on $SHA after 30 minutes. Re-run this workflow when it has finished."
            else
              echo "::error::there is no successful CI run on $SHA. Merge the commit to the default branch and let CI pass (or run CI by hand on the tag with workflow_dispatch), then re-run this workflow."
            fi
            exit 1
          done

  build:
    name: Build the installer (unsigned, no secrets)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      installer: ${{ steps.installer.outputs.name }}
      sha256: ${{ steps.installer.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the gate checked, not the tag name: a tag can be moved between jobs, a
          # commit cannot.
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          # The exact compiler, not the `stable` branch's head: a release is reproducible only if
          # the version that compiled it is named. Bump this and `Cargo.lock` together.
          toolchain: 1.99.1

      - name: Cache the Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Two workspaces: the repo's own (target/) and the desktop shell's, which is a
          # separate workspace rooted at apps/desktop/src-tauri.
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Fetch the ffmpeg sidecars
        # Pinned and checksum-verified (sidecars.toml); bundling refuses to run without them.
        # `--locked` is a cargo flag and goes before the `xtask` alias.
        shell: bash
        run: cargo --locked xtask sidecars fetch --target x86_64-pc-windows-msvc

      - name: Install the frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the frontend
        # `tauri build` runs this as its `beforeBuildCommand`, so this step is the same
        # build twice over. It is here so that a missing `apps/desktop/dist` fails with a
        # readable error instead of inside the Rust build, where the release build panics
        # on a missing `tauri::generate_context!` input.
        working-directory: apps/desktop
        run: npm run build

      - name: Build the NSIS installer
        # `--no-sign`: this job has no signing key, on purpose. It runs every build script and
        # every dependency, so a key in its environment would be readable by all of them; the
        # `sign` job signs the finished installer instead. With the flag the bundler skips the
        # updater signature and still writes `replayed_<version>_x64-setup.exe`.
        #
        # `shell: bash`, because PowerShell strips the `--` that separates the CLI's flags
        # from cargo's (docs/packaging.md §3): everything after the second `--` is passed to
        # `cargo build`, which is how `--locked` reaches it. The `nsis` target comes from
        # tauri.windows.conf.json.
        shell: bash
        working-directory: apps/desktop
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-sign -- --locked

      - name: Check the installer exists and carries the sidecars
        # The check CI runs, before anything is published: the NSIS archive is listed with
        # 7-Zip (preinstalled on the runner); it is not run.
        id: installer
        shell: pwsh
        run: |
          $dir = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $found = @(Get-ChildItem -Path $dir -Filter 'replayed_*_x64-setup.exe')
          if ($found.Count -ne 1) { throw "expected exactly one NSIS installer in $dir, found $($found.Count)" }
          $exe = $found[0]
          Write-Host "installer: $($exe.FullName) ($($exe.Length) bytes)"
          $listing = & 7z l $exe.FullName | Out-String
          foreach ($name in 'ffmpeg.exe', 'ffprobe.exe', 'replayed.exe') {
            if ($listing -notmatch [regex]::Escape($name)) {
              Write-Host $listing
              throw "the installer does not contain $name"
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          Write-Host "sha256: $hash"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Anti-cheat guard on the executable the installer ships
        # The binary half of docs/anti-cheat.md. The source guard cannot see a dependency that
        # calls `SendInput`; the import table of the executable that ships can, and so can the
        # string scan for a name looked up at run time. The installer is unpacked with 7-Zip and
        # the `replayed.exe` inside it is the file that is read: that is what a user runs, not
        # merely what cargo produced. The sidecar `ffmpeg.exe` / `ffprobe.exe` are third-party
        # binaries and are not checked here.
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'installer-contents'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          & 7z x -y "-o$out" $env:INSTALLER_PATH | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack the installer" }
          $exes = @(Get-ChildItem -Path $out -Recurse -Filter 'replayed.exe' -File)
          if ($exes.Count -ne 1) { throw "expected one replayed.exe in the installer, found $($exes.Count)" }
          & bash scripts/check-forbidden-apis.sh --binary $exes[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "the executable the installer ships names a forbidden Windows API (docs/anti-cheat.md)"
          }

      - name: Keep the unsigned installer
        # Before anything is signed or published, so a failure further down still leaves the
        # built installer on the Actions page. Only the installer: nothing here is signed.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ needs.gate.outputs.tag }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign the installer (the only job with the key)
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The signing key lives in this environment's scope. Add required reviewers to the
    # `release` environment (Settings -> Environments) and every release waits here for one.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        # No `cache:` — a cache is restored from other runs, including runs on pull requests, and
        # this is the one job whose environment holds the key.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the Tauri CLI
        # From the lockfile, with no lifecycle scripts: the only thing that runs in this job
        # while the key is present is the CLI's own binary.
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Fetch the unsigned installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ needs.gate.outputs.tag }}
          path: release

      - name: Check it is the installer that was built
        shell: bash
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum "release/$INSTALLER" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::release/$INSTALLER is $actual but the build job produced $EXPECTED_SHA256"
            exit 1
          fi
          echo "$actual  $INSTALLER"

      - name: Sign the installer
        # The only step that reads either secret. `tauri signer sign` writes `<installer>.sig`.
        # `--app-version` puts the version into the signed trusted comment, which the app
        # requires (`requireSignedVersion` in tauri.conf.json).
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INSTALLER: ${{ needs.build.outputs.installer }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::this release needs the updater's signing key: set the repository (or release environment) secret TAURI_SIGNING_PRIVATE_KEY (the base64 private minisign key) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The public half of that key pair is the one pinned in plugins.updater.pubkey in tauri.conf.json."
            exit 1
          fi
          ./node_modules/.bin/tauri signer sign --app-version "$VERSION" "../../release/$INSTALLER"

      - name: Verify the signature against the key pinned in the app
        # No secret in this step. The signer warns and carries on when the key is not the pinned
        # one; this does not. It also requires the signature to name this file and this version.
        shell: bash
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          python3 -I scripts/verify-updater-signature.py \
            --conf apps/desktop/src-tauri/tauri.conf.json --version "$VERSION" "release/$INSTALLER"

      - name: Keep the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature-${{ needs.gate.outputs.tag }}
          path: release/${{ needs.build.outputs.installer }}.sig
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish (draft, verify, release)
    needs: [gate, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Creates the release. This job has no signing key.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      SHA: ${{ needs.gate.outputs.sha }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
      INSTALLER: ${{ needs.build.outputs.installer }}
      INSTALLER_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Fetch the installer and its signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-${{ needs.gate.outputs.tag }}'
          path: release
          merge-multiple: true

      - name: Check what was built is what is being published
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "release/$INSTALLER" | cut -d' ' -f1)"
          if [ "$actual" != "$INSTALLER_SHA256" ]; then
            echo "::error::release/$INSTALLER is $actual but the build job produced $INSTALLER_SHA256"
            exit 1
          fi
          ls -l release

      - name: Verify the signature again
        # The `sign` job checked it; this checks the bytes this job is about to upload, and it
        # does so with no secret and before any release exists.
        shell: bash
        run: |
          python3 -I scripts/verify-updater-signature.py \
            --conf apps/desktop/src-tauri/tauri.conf.json --version "$VERSION" "release/$INSTALLER"

      - name: Write the checksum, the update manifest and the release notes
        shell: bash
        run: |
          set -euo pipefail
          # `sha256sum -c` format: the hash, two spaces, the file name.
          printf '%s  %s\n' "$INSTALLER_SHA256" "$INSTALLER" > release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)

          python3 -I scripts/make-update-manifest.py \
            --version "$VERSION" --tag "$TAG" --repo "$GH_REPO" \
            --installer "$INSTALLER" --sig "release/$INSTALLER.sig" \
            --changelog CHANGELOG.md --out release/latest.json
          cat release/latest.json

          # The notes: a template with placeholders, filled in here. A placeholder left behind
          # is a bug in the template and fails the release instead of reaching a user.
          python3 -I - <<'PY'
          import os, re
          text = open(".github/release-notes.template.md", encoding="utf-8").read()
          notice = ""
          if os.environ["PRERELEASE"] == "true":
              notice = ("> **Pre-release.** This is a candidate build. It is not the latest release and the\n"
                        "> in-app updater will not offer it.\n\n")
          values = {
              "VERSION": os.environ["VERSION"], "TAG": os.environ["TAG"], "COMMIT": os.environ["SHA"],
              "INSTALLER": os.environ["INSTALLER"], "SHA256": os.environ["INSTALLER_SHA256"],
              "PRERELEASE_NOTICE": notice,
          }
          for key, value in values.items():
              text = text.replace("__%s__" % key, value)
          left = re.findall(r"__[A-Z0-9_]+__", text)
          if left:
              raise SystemExit("release notes template has unfilled placeholders: %s" % sorted(set(left)))
          open("release/RELEASE_NOTES.md", "w", encoding="utf-8", newline="\n").write(text)
          PY

      - name: Create the draft release
        shell: bash
        run: |
          set -euo pipefail
          # A release that is already PUBLISHED is never replaced in place: installed copies may
          # have updated from it, and swapping the bytes under them is exactly what the signature
          # is there to prevent. A stale DRAFT (an earlier run that failed after creating it) is
          # this pipeline's own leftover and is replaced.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" = "true" ]; then
              echo "a draft release for $TAG is left over from an earlier run; deleting it"
              gh release delete "$TAG" --yes
            else
              echo "::error::the release $TAG is already published. Published releases are not replaced in place; delete it by hand (and think about who has updated from it) to re-cut."
              exit 1
            fi
          fi

          flags=(--draft --verify-tag --title "replayed $VERSION ($TAG)" --notes-file release/RELEASE_NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # `--verify-tag`: the tag must already exist in the remote repository, so a typo cannot
          # publish a release under a tag nobody pushed.
          gh release create "$TAG" \
            "release/$INSTALLER" "release/$INSTALLER.sig" release/SHA256SUMS release/latest.json \
            "${flags[@]}"

      - name: Verify what GitHub stored
        # The draft's assets are downloaded again, and the installer's hash and the signature
        # are checked on those bytes: an upload that was truncated or altered fails here, while
        # the release is still a draft that nobody can see.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stored && mkdir stored
          gh release download "$TAG" --dir stored
          want="$(printf '%s\n' "$INSTALLER" "$INSTALLER.sig" SHA256SUMS latest.json | sort)"
          have="$(cd stored && printf '%s\n' * | sort)"
          if [ "$want" != "$have" ]; then
            echo "::error::the draft holds the wrong assets. Expected:"
            echo "$want"
            echo "found:"
            echo "$have"
            exit 1
          fi
          (cd stored && sha256sum -c SHA256SUMS)
          for f in "$INSTALLER" "$INSTALLER.sig" SHA256SUMS latest.json; do
            cmp "stored/$f" "release/$f"
          done
          python3 -I scripts/verify-updater-signature.py \
            --conf apps/desktop/src-tauri/tauri.conf.json --version "$VERSION" "stored/$INSTALLER"
          # The manifest has to name the installer this release carries, with its signature.
          python3 -I - <<'PY'
          import json, os
          m = json.load(open("stored/latest.json", encoding="utf-8"))
          sig = open("stored/%s.sig" % os.environ["INSTALLER"], encoding="utf-8").read().strip()
          url = "https://github.com/%s/releases/download/%s/%s" % (
              os.environ["GH_REPO"], os.environ["TAG"], os.environ["INSTALLER"])
          assert m["version"] == os.environ["VERSION"], m["version"]
          for key in ("windows-x86_64-nsis", "windows-x86_64"):
              p = m["platforms"][key]
              assert p["url"] == url, p["url"]
              assert p["signature"] == sig, key
          print("latest.json names", url)
          PY

      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,isDraft,isPrerelease --jq '"\(.url)  draft=\(.isDraft)  prerelease=\(.isPrerelease)"'
